# GoReleaser configuration for PostgreSQL TUI Manager
# See https://goreleaser.com for documentation

version: 2

project_name: postgres-tui

before:
  hooks:
    - go mod tidy

builds:
  - id: postgres-tui
    main: .
    binary: postgres-tui
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: default
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github

homebrew_casks:
  - name: postgres-tui
    skip_upload: '{{ eq .Env.HOMEBREW_TAP_GITHUB_TOKEN "" }}'
    repository:
      owner: davidbudnick
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: https://github.com/davidbudnick/postgres-tui
    description: Lightweight PostgreSQL TUI Manager
    license: MIT

nfpms:
  - id: packages
    package_name: postgres-tui
    vendor: David Budnick
    homepage: https://github.com/davidbudnick/postgres-tui
    maintainer: David Budnick
    description: Lightweight PostgreSQL TUI Manager
    license: MIT
    formats:
      - deb
      - rpm
      - apk
    bindir: /usr/bin

release:
  github:
    owner: davidbudnick
    name: postgres-tui
  draft: false
  prerelease: auto
  mode: replace
  name_template: "postgres-tui v{{.Version}}"
  header: |
    ## What's New in postgres-tui v{{.Version}}
  footer: |
    ## Installation

    ### Quick Install (macOS/Linux)
    ```bash
    curl -fsSL https://raw.githubusercontent.com/davidbudnick/postgres-tui/main/install.sh | bash
    ```

    ### Update Existing Installation
    ```bash
    postgres-tui --update
    ```

    ### Homebrew (macOS/Linux)
    ```bash
    brew tap davidbudnick/homebrew-tap
    brew install --cask postgres-tui
    ```

    ### Go Install
    ```bash
    go install github.com/davidbudnick/postgres-tui@{{.Tag}}
    ```

    ### Binary Download
    Download the appropriate binary for your platform from the assets below.
